<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<meta name="description" content="SGIMTTO · Sistema de Gestión de Informes de Mantenimiento. Desarrollado por Victor Hugo Paguay.">
<meta name="author" content="Victor Hugo Paguay">
<title>SGIMTTO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8871e'/%3E%3Cpath d='M18 4 8 18h8l-2 10 10-14h-8z' fill='%232b1700'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface-2:#f6f7f6; --ink:#16212b; --muted:#5b6672; --line:#d9dee2;
  --brand:#0f2a3d; --brand-2:#173e59; --accent:#e8871e; --accent-ink:#2b1700;
  --ok:#1d7f47; --ok-bg:#e3f3e9; --bad:#b8322a; --bad-bg:#fbe7e5; --na:#6b7783; --na-bg:#eceff1;
  --warn:#a35f00; --warn-bg:#fff2dc; --focus:#2f7fd1;
  --r:10px; --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#172027; --surface-2:#1d2830; --ink:#e7ecef; --muted:#9aa7b2; --line:#2b3740;
  --brand:#0b1f2d; --brand-2:#14354c; --ok:#4cc27e; --ok-bg:#163526; --bad:#ff7b6f; --bad-bg:#3a1c1a; --na:#a3b0bb; --na-bg:#25313a;
  --warn:#ffb54d; --warn-bg:#3a2a12; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0f1418; --surface:#172027; --surface-2:#1d2830; --ink:#e7ecef; --muted:#9aa7b2; --line:#2b3740;
  --brand:#0b1f2d; --brand-2:#14354c; --ok:#4cc27e; --ok-bg:#163526; --bad:#ff7b6f; --bad-bg:#3a1c1a; --na:#a3b0bb; --na-bg:#25313a; --warn:#ffb54d; --warn-bg:#3a2a12; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(22px,4vw,28px);font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover{background:var(--brand)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg,.icon-btn svg{width:18px;height:18px;flex:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:inherit}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;border-bottom:3px solid var(--accent)}
.topbar .inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:58px}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em;font-family:var(--mono);font-size:17px;color:#fff;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.brandmark .sq{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brandmark .sq svg{width:18px;height:18px}
.topbar .who{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95}
.topbar .who b{font-weight:600}
.topbar .icon-btn{color:#fff}
.topbar .icon-btn:hover{background:rgba(255,255,255,.12);border-color:transparent}
.chip-role{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.14);font-weight:600;letter-spacing:.02em}
@media (max-width:560px){.topbar .who .nm{display:none}}

.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;font-family:var(--mono);margin-top:2px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid-co{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.co{display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;overflow:hidden;transition:transform .12s,border-color .12s}
.co:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.co .logo{height:110px;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--line);padding:12px}
.co .logo img{max-height:86px;max-width:80%;object-fit:contain}
.co .logo .ph{font-family:var(--mono);font-weight:700;font-size:28px;color:#fff;width:64px;height:64px;border-radius:12px;display:grid;place-items:center}
.co .body{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.co .stats{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.co .stats b{color:var(--ink);font-family:var(--mono)}
.co.new{border-style:dashed;align-items:center;justify-content:center;min-height:200px;color:var(--muted);font-weight:600;gap:8px;background:transparent;box-shadow:none}
.co.new svg{width:28px;height:28px}

/* tabs */
.cohead{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.cohead .lg{width:64px;height:64px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.cohead .lg img{max-width:56px;max-height:56px;object-fit:contain}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab svg{width:17px;height:17px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.borrador{background:var(--na-bg);color:var(--na)}
.chip.elaborado{background:var(--warn-bg);color:var(--warn)}
.chip.aprobado{background:var(--ok-bg);color:var(--ok)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .req{color:var(--bad)}
.in,select.in,textarea.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:400}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
.in:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.in[readonly]{background:var(--surface-2)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand-2)}
.hint{font-size:12px;color:var(--muted);font-weight:400}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .side{background:var(--brand);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .side::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.login .side > *{position:relative;z-index:1}
.login .big{font-family:var(--mono);font-weight:700;font-size:clamp(44px,7vw,76px);letter-spacing:.02em;line-height:1}
.login .big span{color:var(--accent)}
.login .tag{font-size:18px;max-width:30ch;margin-top:14px;opacity:.9}
.login .feat{display:grid;gap:10px;margin-top:28px;font-size:14px;opacity:.9}
.login .feat div{display:flex;gap:10px;align-items:center}
.login .feat svg{width:18px;height:18px;color:var(--accent);flex:none}
.login .dev{font-size:13px;opacity:.8;border-top:1px solid rgba(255,255,255,.18);padding-top:16px;margin-top:28px}
.login .main{display:grid;place-items:center;padding:32px 16px}
.login .box{width:100%;max-width:380px;display:grid;gap:16px}
.testbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:99px;width:max-content}
.profiles{display:grid;gap:8px;max-height:46vh;overflow:auto}
.profile{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.profile:hover{border-color:var(--brand-2)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;font-family:var(--mono)}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .side{padding:28px 20px}.login .feat{display:none}.login .dev{margin-top:16px}}

/* wizard */
.wz-head{position:sticky;top:61px;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.wz-head .inner{max-width:1000px;margin:0 auto;padding:10px 16px 0}
.wz-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.saved{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.saved svg{width:14px;height:14px;color:var(--ok)}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.st{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;color:var(--muted)}
.st .n{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1px solid var(--line)}
.st.on{border-color:var(--brand-2);color:var(--ink);background:color-mix(in srgb,var(--brand-2) 8%,var(--surface))}
.st.on .n{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
.st.done .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.st .pr{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.wz{max-width:1000px;margin:0 auto;padding:18px 16px 110px}
.wz-foot{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.wz-foot .inner{max-width:1000px;margin:0 auto;display:flex;gap:10px;align-items:center}
.sec{margin-bottom:16px}
.sec > header{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.sec > .bd{padding:16px}
.lock{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:14px;margin-bottom:14px;font-weight:500}
.lock svg{width:18px;height:18px;flex:none;margin-top:1px}
fieldset{border:0;margin:0;padding:0;min-width:0}

.eqcard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
.eqcard div{background:var(--surface-2);padding:8px 10px;font-size:13px}
.eqcard div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.eqcard div b{font-family:var(--mono);font-weight:600}
@media (max-width:640px){.eqcard{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* checklist */
.cl{display:flex;flex-direction:column}
.cl .it{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cl .it:last-child{border-bottom:0}
.cl .num{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.cl .tx{font-size:14.5px}
.cl .h1{padding:12px 10px;margin-top:10px;background:color-mix(in srgb,var(--brand-2) 10%,var(--surface));border-radius:6px;font-weight:700;font-size:13px;letter-spacing:.03em}
.cl .h2{padding:10px 0 4px;font-weight:650;font-size:14px;color:var(--brand-2);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cl .h2{color:#8ec3ea}}
@media (max-width:640px){.cl .it{grid-template-columns:28px minmax(0,1fr)}.cl .it .ctl{grid-column:2/-1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{min-width:46px;min-height:40px;padding:0 10px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:13px;font-family:var(--mono);color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on.v-ok{background:var(--ok);color:#fff}
.seg button.on.v-x{background:var(--bad);color:#fff}
.seg button.on.v-na{background:var(--na);color:#fff}
.seg button.on.v-st{background:var(--brand-2);color:#fff}
.valin{display:flex;align-items:center;gap:6px}
.valin .in{width:130px;min-height:40px;font-family:var(--mono);text-align:right}
.valin .u{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:34px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend b{font-family:var(--mono);color:var(--ink)}

/* photos */
.ph-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ph-actions .btn{min-height:64px;font-size:15px}
.ph-actions .btn svg{width:22px;height:22px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ph{overflow:hidden;display:flex;flex-direction:column}
.ph .im{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.ph .im img{width:100%;height:100%;object-fit:cover}
.ph .bd{padding:10px;display:grid;gap:8px}
.ph textarea.in{min-height:70px}
.ph .tools{display:flex;gap:4px;align-items:center}
.ph .tools .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* signatures */
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.sigs{grid-template-columns:1fr}}
.sigbox{padding:16px;display:grid;gap:10px;align-content:start}
.sigimg{height:110px;border:1px dashed var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden}
.sigimg img{max-height:100px;max-width:90%}
.sigimg .pend{color:#8a949e;font-size:13px;font-weight:600}
.padwrap{border:2px dashed var(--line);border-radius:10px;background:#fff;position:relative}
.padwrap canvas{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair}
.padwrap .base{position:absolute;left:8%;right:8%;bottom:48px;border-bottom:1px solid #c7ced4;pointer-events:none}
.padwrap .lbl{position:absolute;left:8%;bottom:28px;font-size:11px;color:#8a949e;pointer-events:none}
@media (max-width:640px){.padwrap canvas{height:200px}}

/* pdf preview */
.pdfview{background:#525659;border-radius:8px;padding:14px;display:grid;gap:14px;justify-items:center;max-height:75vh;overflow:auto}
.pdfview canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);max-width:100%;height:auto}
.pdfview .ld{color:#fff;padding:40px;font-size:14px}

/* checklist summary */
.chk-sum{display:grid;gap:6px;font-size:14px}
.chk-sum div{display:flex;gap:8px;align-items:center}
.chk-sum svg{width:16px;height:16px;flex:none}
.chk-sum .ok{color:var(--ok)} .chk-sum .bad{color:var(--warn)}

/* template editor */
.tpl-row{display:grid;grid-template-columns:110px minmax(0,1fr) 80px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tpl-row .in{min-height:38px;padding:6px 10px;font-size:14px}
.tpl-row.h1 .txt{font-weight:700}
.tpl-row.h2 .txt{font-weight:600;font-style:italic}
.tpl-row .tools{display:flex;gap:2px}
.tpl-row .tools .icon-btn{width:32px;height:32px}
@media (max-width:640px){.tpl-row{grid-template-columns:1fr 70px;}.tpl-row .txt{grid-column:1/-1;grid-row:1}.tpl-row .tools{grid-column:1/-1;justify-content:flex-end}}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px}
details.acc > summary{cursor:pointer;padding:14px 16px;font-weight:650;display:flex;align-items:center;gap:10px;list-style:none}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"+";margin-left:auto;font-family:var(--mono);font-size:18px;color:var(--muted)}
details.acc[open] > summary::after{content:"–"}
details.acc > .bd{padding:4px 16px 16px}

/* design */
.dz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.dz{grid-template-columns:1fr}}
.colorin{display:flex;gap:8px;align-items:center}
.colorin input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}
.mock{background:#fff;color:#222;aspect-ratio:210/297;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:9% 9%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6%;position:sticky;top:80px;overflow:hidden}
.mock .ml{height:22%;display:grid;place-items:center}
.mock .ml img{max-height:100%;max-width:70%;object-fit:contain}
.mock .mt1{font-weight:700;font-size:15px}
.mock .mt2{font-weight:700;font-size:11px;line-height:1.35}
.mock .mt3{font-size:10px}
.mock .bar{position:absolute;left:0;right:0;bottom:0;height:5%}
.mock .bar2{position:absolute;left:0;bottom:5%;height:1%;width:40%}
.logo-drop{display:flex;gap:12px;align-items:center}
.logo-drop .pv{width:110px;height:70px;border:1px dashed var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden}
.logo-drop .pv img{max-width:100px;max-height:60px;object-fit:contain}

/* modal */
.mback{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal.wide{max-width:900px}
.modal > header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal > header h3{flex:1}
.modal .mbody{padding:16px;overflow:auto}
.modal > footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:640px){.mback{padding:0;align-items:flex-end}.modal{max-height:94vh;border-radius:14px 14px 0 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;display:grid;gap:8px;pointer-events:none}
.toast{background:#1d2a33;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s;max-width:90vw}
.toast.bad{background:var(--bad)}
.toast.ok{background:var(--ok)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters .in{width:auto;flex:1;min-width:180px}
.filters select.in{flex:0 0 auto;min-width:160px}
.only-m{display:none}
@media (max-width:640px){.hide-m{display:none}.only-m{display:initial}}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}

.testbadge svg{width:14px;height:14px}
details.acc > summary svg{width:18px;height:18px;flex:none}
label.f .lb{display:block}
@media (max-width:640px){.cl .it .ctl .seg{display:flex;width:100%;flex-wrap:nowrap}.cl .it .ctl .seg button{flex:1;min-width:0;padding:0 2px;font-size:12px}}

/* M08.5 v1.1.0: botones con texto en Trabajos realizados */
.seg.txt button{font-family:var(--font);font-weight:600;font-size:13px;padding:0 12px}
.seg.txt button:first-child{min-width:150px}
@media (max-width:640px){.cl .it .ctl .seg.txt button{font-size:12.5px}.cl .it .ctl .seg.txt button:first-child{flex:2.2;min-width:0}}

/* M09 v1.1.0: recuadro de firma táctil en pantalla */
.padwrap.inl canvas{height:170px}
.mback .padwrap canvas{height:260px}
@media (max-width:640px){.mback .padwrap canvas{height:300px}}

/* M08 v1.2.0 */
svg.lk{width:12px;height:12px;vertical-align:-1px}

/* v2.1.0: tres firmas y técnicos de apoyo */
.sigs.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.sigs.s3{grid-template-columns:1fr}}
.apoyos{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.check.apo{border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--surface);font-size:14px}
.check.apo input{width:18px;height:18px}
/* M08.1 v2.2.0: campos compuestos (horómetro + No aplica, Elaborado por fijo) */
div.f.fx{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
div.f.fx .req{color:var(--bad)}
div.f.fx .lb{display:block}

/* M13 v2.3.0 · Nuevo informe por clase y lector de OT */
.clases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.clase{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font:inherit;color:inherit;min-height:120px}
.clase:hover,.clase:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.clase b{font-size:15px}
.cl-tag{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.cl-tag.ot{background:#e3effa;color:#1d5d95}
.otal{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:13px;background:var(--warn-bg);color:var(--ink,inherit)}
.otal svg{flex:none;width:18px;height:18px;color:var(--warn)}
.otal.b{background:#fde8e8}.otal.b svg{color:var(--bad)}
.otkv{grid-template-columns:repeat(2,minmax(0,1fr))}
.otacts{border:1px solid var(--line);border-radius:10px;max-height:46vh;overflow:auto}
.otact{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.otact:last-child{border-bottom:0}
.otact.tit{background:var(--surface-2);font-weight:600}
.otact.off .tx{text-decoration:line-through;opacity:.5}
.otact .n{color:var(--muted)}
.tbl.mats input.in{min-height:38px;padding:6px 8px}
.tbl.mats td{padding:4px}
.hide{display:none!important}
@media (max-width:640px){.clases{grid-template-columns:1fr}.otkv{grid-template-columns:1fr}.otact{grid-template-columns:28px 1fr;}.otact label{grid-column:2}}

/* ===== v3.0.0 · M14 permisos ATS/PTS, M08.CM correctivo, ATS al inicio ===== */
.cl-tag.cm{background:#fde8e8;color:#9a2a22}
.cl-tag.pe{background:#e6f3ea;color:#1d6b3f}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chips button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:600 14px var(--font);cursor:pointer}
.chips button svg{width:16px;height:16px}
.chips button.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.chips button .mono{font-size:12px;opacity:.8}
.tin{display:flex;gap:6px;align-items:center}.tin input{flex:1;min-width:0}
.tg{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:500 13px var(--font);cursor:pointer;min-height:36px}
.tg.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
.perm .row{flex-wrap:wrap}
.fmtbar{display:flex;gap:14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0 14px}
.fmtbar img{height:44px;width:auto;border-radius:4px;background:#fff;padding:2px}.fmtbar div{display:flex;flex-direction:column}.fmtbar span{font-size:12px;color:var(--muted)}
.eppg{display:grid;gap:8px}.eppr{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}.eppc{font-size:13px;font-weight:600;color:var(--muted)}
.eppo{max-width:160px;min-height:36px!important;padding:4px 8px!important}
.fg{margin-bottom:10px}
.tbl.pasos textarea.in{min-height:56px;padding:6px 8px;font-size:13px}.tbl.pasos td{padding:4px;vertical-align:top}
.tbl.perfirm input.in,.tbl.firmas input.in{min-height:38px;padding:6px 8px}.tbl.perfirm td,.tbl.firmas td{padding:4px 6px}
.tbl.firmas tr.sub td{background:var(--surface-2);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sigmini{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px 8px 2px 2px;cursor:pointer;max-width:100%;min-height:44px}
.sigmini img{height:44px;width:auto;max-width:180px}
.sigmini .sas{font:600 10px var(--font);color:#0b6e3a;background:#e3f3ea;border-radius:99px;padding:2px 7px}
.sigs3p{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sgp{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pgrp{font-size:13px;font-weight:700;color:var(--brand-2);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.acts{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.act{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:8px 10px;border-top:1px solid var(--line);align-items:center;background:var(--surface);font-size:14px}
.act:first-child{border-top:0}.act .n{color:var(--muted);font-size:12px}.act .t{display:flex;flex-direction:column;gap:6px}
.decl{margin-top:12px;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.cmstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.stat span{font-size:12px;color:var(--muted);font-weight:600}.stat b{font:700 18px var(--mono)}.stat small{font-size:11px;color:var(--muted)}
.cmt{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}.cmt .n{color:var(--muted);font-size:12px}
.quick h3{margin:2px 0 8px}
.eqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.eqt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-height:60px}
.eqt b{font:600 17px var(--mono)}.eqt span{font-size:12px;color:var(--muted)}
.eqt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--accent)}
.chipsq{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chipsq button{border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);padding:6px 12px;font:500 13px var(--font);cursor:pointer;min-height:36px}
pre.cierre{white-space:pre-wrap;font:13px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;color:var(--ink)}
@media (max-width:760px){.sigs3p,.cmstats{grid-template-columns:1fr}.eppr{grid-template-columns:1fr}.act{grid-template-columns:24px 1fr}.act .seg{grid-column:2}}

  async get(store, key) { if (!IDBX) { const v = MEM[store].get(key); return v ? clone(v) : undefined; } return idbReq(IDBX.transaction(store).objectStore(store).get(key)); },
  async all(store) { if (!IDBX) return [...MEM[store].values()].map(clone); return idbReq(IDBX.transaction(store).objectStore(store).getAll()); },
  async del(store, key) { if (!IDBX) { MEM[store].delete(key); return; } const tx = IDBX.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); return txDone(tx); },
  async clear(store) { if (!IDBX) { MEM[store].clear(); return; } const tx = IDBX.transaction(store, 'readwrite'); tx.objectStore(store).clear(); return txDone(tx); }

function sigPad(canvas) {

  canvas.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2; ctx.quadraticCurveTo(last.x, last.y, mx, my); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; dirty = true; });
  const end = () => { drawing = false; };

  requestAnimationFrame(fit);

    clear: fit, isEmpty: () => !dirty,
    toData() {
      const w = canvas.width, h = canvas.height, d = ctx.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0) return null; const pad = 12; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);

    }

}

/* --- Sugerencia de PTS según los factores marcados --- */
function sugerirPTS(a) {
  const f = a.factores, s = {};
  if (f['Trabajo en altura (>1,8m)']) s.altura = 'trabajo en altura';
  if (f['Presencia de puntos de ignición'] || f['Manejo de inflamables y/o explosivos']) s.caliente = 'puntos de ignición o inflamables';
  if (f['Riesgo eléctrico'] || f['Recipientes o elementos a presión']) s.especial = 'energía eléctrica o a presión (bloqueo y etiquetado)';
  if (f['Espacio físico reducido']) s.confinado = 'espacio físico reducido: confirme si es espacio confinado';
  return s;
}

function nomApe(nombre) { const w = String(nombre || '').trim().split(/\s+/).filter(Boolean); if (w.length <= 1) return { nom: w[0] || '', ape: '' }; const k = w.length > 3 ? 2 : 1; return { nom: w.slice(0, k).join(' '), ape: w.slice(k).join(' ') }; }

/* ---------- guardado y sincronización ---------- */
function savePerm(kind, o, inmediato) {
  o.actualizado = ahora(); const L = D[kind]; if (!L.includes(o)) L.push(o);
  clearTimeout((PERM_PEND.get(o.id) || {}).t);
  const run = () => { PERM_PEND.delete(o.id); FB.setDoc(dref(kind + '/' + o.id), limpio(o)).catch(avisarError); };
  if (inmediato) return run();
  PERM_PEND.set(o.id, { t: setTimeout(run, 400), run });
}
function flushPerm() { for (const [, p] of [...PERM_PEND]) { clearTimeout(p.t); p.run(); } }
window.addEventListener('pagehide', flushPerm);
function aplicarPerm(kind, docs) {
  let cambio = false; const ids = new Set(); const L = D[kind];
  for (const d of docs) { ids.add(d.id); if (PERM_PEND.has(d.id)) continue; const loc = L.find(x => x.id === d.id);
    if (loc && stable(loc) === stable(d)) continue; if (loc) reemplazar(loc, d); else L.push(d); cambio = true; }
  for (const o of [...L]) if (!ids.has(o.id) && !PERM_PEND.has(o.id)) { L.splice(L.indexOf(o), 1); cambio = true; }
  return cambio;
}
/* numeración única por empresa y tipo (counters/ats_<empresa>, counters/pts_<empresa>) */
async function numerarPerm(kind, o) {
  if (o.n) return o.n; if (!NUBE.online) throw new Error('Se necesita señal para asignar el número. El documento queda guardado como borrador.');
  const usados = new Set(D[kind].filter(x => x.cid === o.cid && x.n).map(x => +x.n));
  const n = await FB.runTransaction(FS, async tx => { const cref = dref('counters/' + kind + '_' + o.cid); const cs = await tx.get(cref);
    let next = cs.exists() ? (cs.data().next || 1) : 1; while (usados.has(next)) next++; tx.set(cref, { next: next + 1 }, { merge: true }); return next; });
  o.n = pad3(n); savePerm(kind, o, true); return o.n;
}
const sigNum = (kind, cid) => { const c = D.counters[kind + '_' + cid]; let n = (c && c.next) || 1; const us = new Set(D[kind].filter(x => x.cid === cid && x.n).map(x => +x.n)); while (us.has(n)) n++; return n; };

/* ---------- firma: con PIN (firma registrada) o con el dedo ---------- */
function firmar({ titulo, cid, soloSAS, fijo, sugerido, nombre }) {
  /* fijo: id del usuario que debe firmar (solo su PIN o su trazo) · false: persona sin usuario (solo con el dedo) */
  return new Promise(res => {
    let result = null, modo = soloSAS ? 'pin' : fijo === false ? 'dedo' : 'pin';
    const cand = soloSAS ? sasDe(cid).filter(u => u.tienePin) : usuariosCo(cid).filter(u => u.firma && u.tienePin && !u.sas && (!fijo || u.id === fijo));
    if (!soloSAS && fijo && !cand.length) modo = 'dedo';
    if (soloSAS && !cand.length) { toast('No hay un responsable SAS con PIN en esta empresa. El administrador debe asignarlo en Usuarios.', 'bad'); return res(null); }
    const sel = (fijo && cand.find(u => u.id === fijo)) || cand.find(u => u.id === sugerido) || cand.find(u => u.id === S.uid) || cand[0];
    const uFijo = fijo ? D.users.find(u => u.id === fijo) : null;
    modal({ title: titulo, body: '<div data-fz></div>', fijo: true, onMount(el, close) {
      const box = el.querySelector('[data-fz]'); let pad = null;
      const pinta = () => {
        box.innerHTML = `${soloSAS ? `<div class="otal">${ic('lock')}<span>Bloqueado: esta firma solo la registra el <b>responsable SAS</b> con su PIN personal.</span></div>`
          : fijo === false ? '<p class="small muted" style="margin-bottom:10px">Esta persona no tiene usuario en SGIMTTO: firma con el dedo.</p>'
          : `<div class="seg txt" role="group" style="margin-bottom:12px">${[['pin', 'Con mi PIN'], ['dedo', 'Con el dedo']].map(([v, t]) => `<button type="button" data-modo="${v}" class="v-st ${modo === v ? 'on' : ''}" ${v === 'pin' && !cand.length ? 'disabled' : ''}>${t}</button>`).join('')}</div>`}
        ${modo === 'pin' ? `<form class="form" style="grid-template-columns:1fr" data-ff>
            <label class="f">${soloSAS ? 'Responsable SAS' : 'Usuario que firma'}<select class="in" name="u" ${fijo ? 'disabled' : ''}>${cand.map(u => `<option value="${u.id}" ${sel && sel.id === u.id ? 'selected' : ''}>${esc(u.nombre)} · ${esc(u.cargo)}</option>`).join('')}</select></label>
            <label class="f">PIN personal<input class="in mono" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"></label>
            <p class="hint">El PIN no se imprime: solo autoriza a insertar la firma registrada del usuario.</p></form>`
          : `<label class="f" style="margin-bottom:10px">Nombre de quien firma<input class="in" data-nom value="${esc(nombre || (uFijo ? uFijo.nombre : ''))}" ${nombre && fijo !== undefined && fijo !== null ? 'readonly' : ''} placeholder="Personal externo o sin usuario"></label>
            <div class="padwrap"><canvas data-pad></canvas><div class="base"></div><div class="lbl">Firme sobre la línea con el dedo</div></div>`}
        <p class="small" data-err style="color:var(--bad);margin-top:8px"></p>
        <div class="row" style="margin-top:8px">${modo === 'dedo' ? `<button type="button" class="btn" data-clr>${ic('refresh')}Borrar trazo</button>` : ''}<span class="spacer"></span><button type="button" class="btn" data-no>Cancelar</button><button type="button" class="btn primary" data-ok>${ic(modo === 'pin' ? 'lock' : 'pen')}${soloSAS ? 'Validar PIN SAS y firmar' : modo === 'pin' ? 'Validar PIN y firmar' : 'Aceptar firma'}</button></div>`;
        pad = modo === 'dedo' ? sigPad(box.querySelector('[data-pad]')) : null;
        $$('[data-modo]', box).forEach(b => b.onclick = () => { modo = b.dataset.modo; pinta(); });
        const clr = box.querySelector('[data-clr]'); if (clr) clr.onclick = () => pad.clear();
        box.querySelector('[data-no]').onclick = close;
        const err = t => box.querySelector('[data-err]').textContent = t;
        const ff = box.querySelector('[data-ff]'); if (ff) { setTimeout(() => ff.pin.focus(), 60); ff.onsubmit = e => { e.preventDefault(); ok(); }; }
        const okb = box.querySelector('[data-ok]');
        const ok = async () => {
          const t = ahoraLocal(), fecha = t.slice(0, 10), hora = t.slice(11, 16);
          if (modo === 'pin') { const u = D.users.find(x => x.id === (fijo || ff.u.value)); const pin = ff.pin.value; if (!u || !pin) return err('Escriba el PIN.');
            okb.disabled = true; err(''); okb.lastChild.textContent = ' Validando…'; let v = false;
            try { v = await verificarPin(u, pin); } catch (e) { okb.disabled = false; pinta(); return toast(errTxt(e), 'bad'); }
            if (!v) { okb.disabled = false; okb.lastChild.textContent = soloSAS ? 'Validar PIN SAS y firmar' : 'Validar PIN y firmar'; ff.pin.select(); return err('PIN incorrecto.'); }
            let img = u.firma; if (!img) { close(); img = await askSignature(titulo, `${esc(u.nombre)} · firme para registrar`); if (!img) return; }
            result = { img: img.data, w: img.w, h: img.h, modo: soloSAS ? 'sas' : 'pin', uid: u.id, nombre: u.nombre, cargo: u.cargo, ...nomApe(u.nombre), fecha, hora, por: S.uid };
          } else { const n = box.querySelector('[data-nom]').value.trim(); if (!n) return err('Escriba el nombre de quien firma.'); const s = pad.toData(); if (!s) return err('Firme dentro del recuadro.');
            result = { img: s.data, w: s.w, h: s.h, modo: 'dedo', nombre: n, ...(uFijo ? { uid: uFijo.id, ...nomApe(uFijo.nombre) } : nomApe(n)), fecha, hora, por: S.uid }; }
          close();
        };
        okb.onclick = ok;
      };
      pinta();
      const obs = new MutationObserver(() => { if (!document.body.contains(el)) { obs.disconnect(); res(result); } }); obs.observe($('#modal-root'), { childList: true });
    } });
  });
}

  const out = []; let sec = null, gi = -1, i = 0;
  for (let r = 1; r <= L.rango[3]; r++) {
    const s = secs.find(x => r >= x.a && r <= x.b); if (!s) continue; const k = clave(s.t); if (k !== sec) { sec = k; gi = -1; }
    const gm = L.merged.find(m => m[1] === r && m[3] === r && (m[0] === 4 || m[0] === 5) && m[2] >= 12); if (gm && (L.cells[`${gm[0]},${r}`] || {}).v) { gi++; i = 0; continue; }

function needXLSX() { if (!window.XLSX) { toast('No se cargó la librería de Excel (revise su conexión a internet).', 'bad'); return false; } return true; }
function excelDown(co) {
  if (!needXLSX()) return;
  const eqs = D.equipos.filter(e => e.cid === co.id).sort((a, b) => (a.bahia + a.codigo).localeCompare(b.bahia + b.codigo, 'es', { numeric: true }));
  const rows = eqs.map(e => Object.fromEntries(EQ_COLS.map(([k, l]) => [l, e[k] ?? ''])));
  const ws = rows.length ? XLSX.utils.json_to_sheet(rows, { header: EQ_COLS.map(c => c[1]) }) : XLSX.utils.aoa_to_sheet([EQ_COLS.map(c => c[1])]);
  ws['!cols'] = [10, 8, 22, 14, 12, 12, 12, 12, 18].map(w => ({ wch: w })); ws['!autofilter'] = { ref: `A1:I${Math.max(1, rows.length + 1)}` };
  const help = XLSX.utils.aoa_to_sheet([['INSTRUCCIONES – CARGA DE EQUIPOS SGIMTTO'], [''], ['1. No modifique los encabezados de la hoja "Equipos".'], ['2. Cada fila es un equipo. La columna Código es obligatoria y única (ej. GE03).'], ['3. Si el Código ya existe, el equipo se actualiza; si no existe, se crea.'], ['4. Los equipos que borre del Excel NO se eliminan del sistema (elimínelos desde la aplicación).'], ['5. Guarde el archivo y use el botón "Cargar Excel" en la pestaña Equipos.'], [''], ['Empresa: ' + co.nombre], ['Generado: ' + new Date().toLocaleString('es-EC')]]);
  help['!cols'] = [{ wch: 95 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Equipos'); XLSX.utils.book_append_sheet(wb, help, 'Instrucciones');
  XLSX.writeFile(wb, `Equipos_${co.nombre.replace(/[^\w]+/g, '_')}_${hoyISO()}.xlsx`);
}
async function excelUp(co, file) {
  if (!needXLSX()) return;
  try {
    const wb = XLSX.read(await readAsBuf(file), { type: 'array' }); const ws = wb.Sheets['Equipos'] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    const map = {}; EQ_COLS.forEach(([k, l]) => map[norm(l)] = k); map[norm('Modelo motor')] = 'modelo2'; map[norm('Bahia')] = 'bahia';
    let nuevos = 0, act = 0, omit = 0;
    for (const row of rows) { const e = {}; for (const [h, v] of Object.entries(row)) { const k = map[norm(h)]; if (k) e[k] = String(v).trim(); }
      if (!e.codigo) { omit++; continue; } e.codigo = e.codigo.toUpperCase();
      const ex = D.equipos.find(x => x.cid === co.id && x.codigo.toUpperCase() === e.codigo);
      if (ex) { Object.assign(ex, e); act++; } else { D.equipos.push({ id: uid(), cid: co.id, codigo: '', bahia: '', marca: '', modelo: '', motor: '', modelo2: '', potencia: '', tension: '', sitio: '', ...e }); nuevos++; } }
    await saveKV('equipos'); render(); toast(`Excel cargado: ${nuevos} nuevo(s), ${act} actualizado(s)${omit ? `, ${omit} fila(s) sin código omitidas` : ''}.`, 'ok');
  } catch (e) { console.error(e); toast('No se pudo leer el Excel: ' + e.message, 'bad'); }
}

function commitOps(ops) {
  // lotes de hasta 400 operaciones o ~8 MB; no se espera la confirmación del servidor (funciona sin señal)
  const proms = []; let b = null, n = 0, size = 0;
  const flush = () => { if (b && n) proms.push(b.commit()); b = FB.writeBatch(FS); n = 0; size = 0; };
  flush();
  for (const [op, path, data] of ops) {
    const s = data ? JSON.stringify(data).length : 50;
    if (n >= 400 || size + s > 8e6) flush();
    if (op === 'set') b.set(dref(path), data); else if (op === 'merge') b.set(dref(path), data, { merge: true }); else b.delete(dref(path));
    n++; size += s;
  }
  flush();
  return Promise.all(proms);
}
function avisarError(e) { console.error(e); toast('No se pudo guardar en la nube: ' + errTxt(e), 'bad'); }
async function syncCol(col, arr, map = x => x) {
  const last = NUBE.last[col] || (NUBE.last[col] = new Map());
  const ids = new Set(); const ops = [];
  for (const o of arr) {
    const data = limpio(map(o)); const js = stable(data); ids.add(o.id);
    if (js.length > 1000000) { toast(`El registro ${o.nombre || o.id} es demasiado grande para la nube (reduzca el logo o las imágenes).`, 'bad'); continue; }
    if (last.get(o.id) !== js) { ops.push(['set', col + '/' + o.id, data]); last.set(o.id, js); }
  }
  for (const id of [...last.keys()]) if (!ids.has(id)) { ops.push(['del', col + '/' + id]); last.delete(id); }
  if (ops.length) return commitOps(ops);
}

    if (store === 'reports') { const d = limpio(obj); NUBE.last.reports = NUBE.last.reports || new Map(); NUBE.last.reports.set(obj.id, stable(d)); FB.setDoc(dref('reports/' + obj.id), d).catch(avisarError); return; }
    if (store === 'photos') { FB.setDoc(dref('photos/' + obj.id), limpio(obj)).catch(avisarError); return; }
  },
  async get(store, key) {

    return [];
  },
  async del(store, key) { if (store === 'reports' || store === 'photos') { if (NUBE.last.reports) NUBE.last.reports.delete(key); FB.deleteDoc(dref(store + '/' + key)).catch(avisarError); } },

/* ---------- lectura en vivo ---------- */
function reemplazar(obj, data) { for (const k of Object.keys(obj)) if (!(k in data)) delete obj[k]; Object.assign(obj, data); }
const ORDEN = {
  companies: (a, b) => String(a.creado || '').localeCompare(String(b.creado || '')),
  users: (a, b) => (a.rol === 'admin' ? 0 : 1) - (b.rol === 'admin' ? 0 : 1) || String(a.usuario).localeCompare(String(b.usuario)),
  equipos: (a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es', { numeric: true })
};
function aplicarKV(k, docs) {
  const col = KV_COL[k]; const last = NUBE.last[col] || (NUBE.last[col] = new Map());
  if (NUBE.pendKV[k] && Date.now() - NUBE.pendKV[k] < 4000) return false;   // el usuario está editando aquí
  const antes = stable(D[k].map(sinClaves));
  const byId = new Map(D[k].map(o => [o.id, o])); const nuevo = [];
  for (const d of docs) { last.set(d.id, stable(d)); const o = byId.get(d.id); if (o) { reemplazar(o, d); nuevo.push(o); } else nuevo.push(d); }
  nuevo.sort(ORDEN[k]); D[k].length = 0; D[k].push(...nuevo);
  return antes !== stable(D[k].map(sinClaves));
}
function aplicarReports(docs) {
  let cambio = false; const ids = new Set(); const last = NUBE.last.reports || (NUBE.last.reports = new Map());
  for (const d of docs) {
    ids.add(d.id); if (pendingRuns.has(d.id)) continue;          // cambios locales aún no enviados: mandan los de aquí
    const js = stable(d); last.set(d.id, js); const loc = R.get(d.id);
    if (loc && stable(loc) === js) continue;
    if (loc) reemplazar(loc, d); else R.set(d.id, d); cambio = true;
  }
  for (const id of [...R.keys()]) if (!ids.has(id) && !pendingRuns.has(id)) { R.delete(id); cambio = true; }
  return cambio;
}
function programarRender() {
  NUBE.renderPend = true;
  if (NUBE.renderTimer) return;
  NUBE.renderTimer = setInterval(() => {
    if (!NUBE.renderPend) return;
    const a = document.activeElement; const editando = a && a.closest && a.closest('#app') && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    const firmando = document.querySelector('.mback') || (pendingRuns.size > 0);
    if (editando || firmando) return;
    NUBE.renderPend = false; if (S.uid) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  }, 700);
}
function escuchar() {
  detenerEscucha();
  return new Promise(res => {
    const falta = new Set(['companies', 'users', 'equipos', 'reports', 'counters', 'settings', 'ats', 'pts']);
    const listo = k => { if (falta.delete(k) && !falta.size) res(); };
    const err = k => e => { console.error(k, e); toast('Error de sincronización: ' + errTxt(e), 'bad'); listo(k); };
    for (const k of Object.keys(KV_COL)) NUBE.unsub.push(FB.onSnapshot(FB.collection(FS, KV_COL[k]), s => { const c = aplicarKV(k, s.docs.map(d => d.data())); if (!falta.has(k) && c) programarRender(); listo(k); }, err(k)));
    NUBE.unsub.push(FB.onSnapshot(FB.collection(FS, 'reports'), s => { const c = aplicarReports(s.docs.map(d => d.data())); if (!falta.has('reports') && c) programarRender(); listo('reports'); }, err('reports')));
    /* M14 v3.0.0: permisos de trabajo ATS / PTS */
    for (const k of ['ats', 'pts']) NUBE.unsub.push(FB.onSnapshot(FB.collection(FS, k), s => { const c = aplicarPerm(k, s.docs.map(d => d.data())); if (!falta.has(k) && c) programarRender(); listo(k); }, err(k)));
    NUBE.unsub.push(FB.onSnapshot(FB.collection(FS, 'counters'), s => { D.counters = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); listo('counters'); }, err('counters')));
    NUBE.unsub.push(FB.onSnapshot(dref('config/settings'), s => { D.settings = s.exists() ? s.data() : {}; listo('settings'); }, err('settings')));
  });
}
function detenerEscucha() { NUBE.unsub.forEach(f => { try { f(); } catch (e) {} }); NUBE.unsub = []; }

/* ---------- numeración única (transacción en la nube) ---------- */
async function asignarNumero(r) {
  if (!r || r.numero || !NUBE.online) return;
  const co = D.companies.find(c => c.id === r.cid); if (!co) return;
  try {
    const n = await FB.runTransaction(FS, async tx => {
      const cref = dref('counters/' + r.cid); const rref = dref('reports/' + r.id);
      const cs = await tx.get(cref); const rs = await tx.get(rref);
      if (rs.exists() && rs.data().numero) return null;
      const next = cs.exists() ? (cs.data().next || 1) : 1;
      tx.set(cref, { next: next + 1 }, { merge: true });
      if (rs.exists()) tx.update(rref, { numero: numInforme(co, next) });
      return next;
    });
    if (n) { r.numero = numInforme(co, n); if (NUBE.last.reports) NUBE.last.reports.delete(r.id); saveReport(r, true); programarRender(); }
  } catch (e) { console.warn('Numeración pendiente', e); }
}

/* ---------- cuentas, contraseñas y PIN ---------- */
async function crearCuentaSec(emailFn, pass, n0) {
  for (let n = n0; n < n0 + 25; n++) {
    try { const c = await FB.createUserWithEmailAndPassword(SEC_AUTH, emailFn(n), padPass(pass)); const authUid = c.user.uid; await FB.signOut(SEC_AUTH); return { authUid, email: emailFn(n), n }; }
    catch (e) { if (!/email-already-in-use/.test(e.code || '')) throw e; }
  }
  throw new Error('No se pudo crear la cuenta');
}
async function cambiarClave(u, pass) {
  const c = await crearCuentaSec(n => emailCuenta(u.usuario, n), pass, (u.authN || 0) + 1);
  const ops = [['set', 'cuentas/' + c.authUid, { uid: u.id, rol: u.rol || 'usuario', activo: u.activo !== false }], ['set', 'login/' + u.usuario.toUpperCase(), { email: c.email }]];
  if (u.rol === 'admin') ops.push(['set', 'login/__ADMIN', { email: c.email }]);
  if (u.authUid && u.authUid !== c.authUid) ops.push(['del', 'cuentas/' + u.authUid]);
  await commitOps(ops);
  return { authUid: c.authUid, authEmail: c.email, authN: c.n };
}

  catch (e) { if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(e.code || '')) return false; throw e; }
}

async function entrarAdmin(pass) {

  if (ses && ses.uid === S.uid) Object.assign(S, ses, { uid: S.uid }); else { S.view = 'admin'; S.cid = null; }
  render(); if (ses && ses.uid !== S.uid) goHome();
  if (c.emergencia || NUBE.porEmergencia) { NUBE.porEmergencia = false; toast('Ingresó con el PIN genérico de emergencia. Cambie su contraseña en ⚙ Configuración.', 'bad'); } else toast('Bienvenido, ' + me().nombre);
  asignarNumeros();
}

/* ================= CARGA INICIAL A LA NUBE (una sola vez) ================= */
const LOCAL_DB = { ...DB };            // acceso a los datos guardados en este navegador (versiones 1.x)
Object.assign(DB, NUBE_DB);           // desde v2.0 todo se guarda en la nube

async function leerLocal() {
  try {
    if (indexedDB.databases) { const dbs = await indexedDB.databases(); if (!dbs.some(d => d.name === 'sgimtto_db')) return null; }
    IDBX = await idbOpen(); if (!IDBX) return null;
    const kv = {}; for (const k of ['companies', 'users', 'equipos', 'settings']) { const r = await LOCAL_DB.get('kv', k); if (r) kv[k] = r.v; }
    if (!kv.companies || !kv.companies.length) return null;
    return { origen: 'este navegador', kv, reports: await LOCAL_DB.all('reports'), photos: await LOCAL_DB.all('photos') };
  } catch (e) { console.warn(e); return null; }
}
function datosEjemplo() {
  const co = newCompany({ nombre: 'ENLINCOM', sitio: 'Guangopolo 3 – Quito', contacto: '' });
  co.logo = { data: SEED_LOGO, w: 520, h: 347 };
  Object.assign(co.design, { encabezado: 'TANERGY / ENLINCOM.', subtitulo: 'MANTENIMIENTO PREVENTIVO GRUPOS ELECTRÓGENOS POWER BY CUMMINS.', ubicacion: 'QUITO-GUANGOPOLO', codigoDoc: 'ENL-INF', primario: '#1b3a57', secundario: '#e8871e' });
  const U = (usuario, nombre, cargo, pass, pin, rol = 'usuario') => ({ id: uid(), cid: rol === 'admin' ? null : co.id, usuario, nombre, cargo, rol, pass, pin, aprueba: !!pin, firma: null, activo: true });
  const users = [U('ADMIN', 'Administrador SGIMTTO', 'Admin SGIMTTO', 'admin2025', '', 'admin'), U('MCALVACHE', 'M. Calvache', 'Jefe de Proyecto', '1234', '1234'), U('VPAGUAY', 'Victor Hugo Paguay', 'Supervisor de Proyecto', '228101', '228101'),
    U('TEC01', 'Técnico 01', 'Técnico de Mantenimiento', '1234', ''), U('TEC02', 'Técnico 02', 'Técnico de Mantenimiento', '1234', ''), U('TLIDER', 'Técnico Líder', 'Jefe de Proyecto', '1234', '1234')];
  const eq = [['GE03', 1], ['GE06', 1], ['GE07', 1], ['GE09', 1], ['GE10', 1], ['GE14', 1], ['GE02', 2], ['GE04', 2], ['GE05', 2], ['GE08', 2], ['GE12', 2], ['GE15', 2]];
  const equipos = eq.map(([codigo, bahia]) => ({ id: uid(), cid: co.id, codigo, bahia: String(bahia), marca: 'Diesel Generator Set', modelo: 'LSC1410S3', motor: 'Cummins', modelo2: 'KTA50-G3', potencia: '1025 kVA', tension: '480/230 V', sitio: 'Guangopolo 3' }));
  return { origen: 'datos de ejemplo', kv: { companies: [co], users, equipos, settings: {} }, reports: [], photos: [] };
}
function resumenDatos(d) { return `${d.kv.companies.length} empresa(s) · ${(d.kv.users || []).length} usuario(s) · ${(d.kv.equipos || []).length} equipo(s) · ${(d.reports || []).length} informe(s) · ${(d.photos || []).length} foto(s)`; }

async function pantallaInicial(reanudar) {
  const local = await leerLocal(); let elegido = local || null;
  const op = (v, t, d, on) => `<label class="profile" style="cursor:pointer"><input type="radio" name="src" value="${v}" ${on ? 'checked' : ''} style="width:20px;height:20px"><span><b>${t}</b><br><span class="small muted">${d}</span></span></label>`;
  $('#app').innerHTML = `<main class="wrap" style="max-width:760px">
    <div class="pagehead"><div><p class="eyebrow">SGIMTTO v${APP_VERSION} · Puesta en marcha</p><h1>${reanudar ? 'Completar la carga inicial' : 'Configuración inicial de la nube'}</h1>${reanudar ? '<p class="note" style="margin-top:10px">La carga anterior quedó incompleta. Elija los mismos datos y toque <b>Completar carga</b>; continúa desde donde quedó.</p>' : ''}</div></div>
    <section class="card sec"><header><h2>1. ¿Qué datos subir?</h2></header><div class="bd" style="display:grid;gap:10px">
      ${local ? op('local', 'Datos de este navegador (recomendado)', esc(resumenDatos(local)), true) : '<p class="note">En este navegador no hay datos de versiones anteriores de SGIMTTO. Si los tiene en otra computadora, abra esta página allí.</p>'}
      ${op('archivo', 'Archivo de respaldo (.json)', 'Un respaldo descargado con ⚙ → Descargar respaldo completo', !local)}
      ${op('ejemplo', 'Empezar con los datos de ejemplo', 'ENLINCOM, 12 equipos de Guangopolo 3 y los usuarios de prueba', false)}
      <input type="file" accept=".json,application/json" data-file hidden></div></section>
    <section class="card sec"><header><h2>2. Usuarios que se crearán</h2></header><div class="bd" data-users></div></section>
    <section class="card sec"><header><h2>3. Subir</h2></header><div class="bd" style="display:grid;gap:12px">
      <p class="small muted">Se crea una cuenta por usuario con su contraseña actual. Las contraseñas y los PIN quedan protegidos en Firebase y dejan de guardarse en el navegador. Requiere internet.</p>
      ${reanudar ? '' : '<label class="f">Contraseña del administrador de esos datos<input class="in mono" type="password" data-apw autocomplete="off" placeholder="La que usa hoy para ingresar como administrador"></label>'}
      <button class="btn accent block" style="min-height:52px" data-go>${ic('up')}${reanudar ? 'Completar carga' : 'Subir a la nube'}</button>
      <pre class="note mono" data-log style="white-space:pre-wrap;max-height:260px;overflow:auto;display:none;margin:0"></pre></div></section></main>`;
  const usersBox = $('[data-users]'), fileIn = $('[data-file]'), log = $('[data-log]');
  const pinta = () => {
    if (!elegido) { usersBox.innerHTML = '<p class="muted small">Elija el archivo de respaldo.</p>'; return; }
    usersBox.innerHTML = `<p class="small" style="margin-bottom:10px">Origen: <b>${esc(elegido.origen)}</b> — ${esc(resumenDatos(elegido))}</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Usuario</th><th>Nombre</th><th>Contraseña</th><th>PIN</th></tr></thead><tbody>${(elegido.kv.users || []).map(u => `<tr><td class="mono"><b>${esc(u.usuario)}</b>${u.rol === 'admin' ? ' <span class="chip aprobado">Admin</span>' : ''}</td><td>${esc(u.nombre)}</td><td>${u.pass ? 'Se conserva la actual' : '<span style="color:var(--warn)">Sin clave: se asigna 1234</span>'}</td><td>${u.aprueba && u.pin ? 'Se conserva' : '—'}</td></tr>`).join('')}</tbody></table></div>`;
  };
  pinta();
  $$('[name=src]').forEach(r => r.onchange = () => { if (r.value === 'local') elegido = local; if (r.value === 'ejemplo') elegido = datosEjemplo(); if (r.value === 'archivo') { elegido = null; fileIn.click(); } pinta(); });
  fileIn.onchange = async () => { const f = fileIn.files[0]; if (!f) return; try { const d = JSON.parse(await readAsText(f)); if (d.app !== 'SGIMTTO' || !d.kv) throw new Error(); elegido = { origen: 'archivo ' + f.name, kv: d.kv, reports: d.reports || [], photos: d.photos || [] }; } catch (e) { toast('El archivo no es un respaldo de SGIMTTO', 'bad'); } pinta(); };
  $('[data-go]').onclick = async () => {
    if (!elegido) return toast('Elija qué datos subir', 'bad');
    const adm = (elegido.kv.users || []).find(u => u.rol === 'admin'); if (!adm) return toast('Los datos no tienen un usuario administrador', 'bad');
    if (!reanudar) { const apw = $('[data-apw]').value; if (!apw) return toast('Escriba la contraseña del administrador', 'bad');
      if (adm.pass && apw !== adm.pass) return toast('La contraseña del administrador no coincide con la de esos datos', 'bad');
      if (!adm.pass) { if (apw.length < 4) return toast('Mínimo 4 caracteres', 'bad'); adm.pass = apw; } }
    if (!await confirmBox(`Se subirán ${esc(resumenDatos(elegido))} a la nube del proyecto <b>${FIREBASE_CONFIG.projectId}</b>. Esta carga se hace una sola vez. ¿Continuar?`, { ok: 'Subir a la nube', title: 'Configuración inicial' })) return;
    const btn = $('[data-go]'); btn.disabled = true; log.style.display = 'block';
    const p = t => { log.textContent += t + '\n'; log.scrollTop = log.scrollHeight; };
    try { await subirDatos(elegido, p, reanudar); p('✔ Carga completa. Ingresando…'); NUBE.iniciando = false; await alCambiarSesion(AUTH.currentUser); }
    catch (e) { console.error(e); NUBE.iniciando = false; p('✖ ' + errTxt(e)); btn.disabled = false; toast('No se completó la carga: ' + errTxt(e), 'bad'); }
  };
}

async function paso(etq, fn) { try { return await fn(); } catch (e) { const x = new Error(`${etq} → ${errTxt(e)}`); throw x; } }
async function subirDatos(src, p, reanudar) {
  NUBE.iniciando = true;
  const kv = clone(src.kv); const users = kv.users || [];
  const admin = users.find(u => u.rol === 'admin');
  if (reanudar) {
    p('Continuando la carga con el administrador conectado…');
    const n0 = parseInt((/-(\d+)@/.exec(reanudar.email || '') || [])[1] || '1', 10);
    if (admin.id !== reanudar.uid) admin.id = reanudar.uid;
    Object.assign(admin, { authUid: reanudar.authUid, authEmail: reanudar.email, authN: n0 });
    await paso('Registro del administrador', () => commitOps([['set', 'login/' + admin.usuario.toUpperCase(), { email: admin.authEmail }], ['set', 'login/__ADMIN', { email: admin.authEmail }]]));
    return subirResto(src, kv, users, admin, p);
  }
  p(`Creando la cuenta del administrador ${admin.usuario}…`);
  let cred = null, n = 1;
  for (; n < 25 && !cred; n++) {
    try { cred = await FB.createUserWithEmailAndPassword(AUTH, emailCuenta(admin.usuario, n), padPass(admin.pass || 'admin2025')); }
    catch (e) { if (!/email-already-in-use/.test(e.code || '')) throw e; try { cred = await FB.signInWithEmailAndPassword(AUTH, emailCuenta(admin.usuario, n), padPass(admin.pass || 'admin2025')); } catch (e2) { /* otra clave: probar el siguiente */ } }
  }
  if (!cred) throw new Error('No se pudo crear la cuenta del administrador');
  n--;
  Object.assign(admin, { authUid: cred.user.uid, authEmail: emailCuenta(admin.usuario, n), authN: n });
  await paso('Inicio de la nube (config/inicial)', () => commitOps([['set', 'config/inicial', { fecha: ahora(), por: admin.usuario, version: APP_VERSION, origen: src.origen }],
    ['set', 'cuentas/' + cred.user.uid, { uid: admin.id, rol: 'admin', activo: admin.activo !== false }],
    ['set', 'login/' + admin.usuario.toUpperCase(), { email: admin.authEmail }], ['set', 'login/__ADMIN', { email: admin.authEmail }]]));
  return subirResto(src, kv, users, admin, p);
}
async function subirResto(src, kv, users, admin, p) {
  for (const u of users) {
    if (u === admin) continue;
    p(`Usuario ${u.usuario}…`);
    Object.assign(u, await paso(`Cuenta de ${u.usuario}`, () => cambiarClave(u, u.pass || '1234')));
    if (u.aprueba && u.pin) Object.assign(u, await paso(`PIN de ${u.usuario}`, () => cambiarPin(u, u.pin))); else Object.assign(u, { tienePin: false, pinEmail: '' });
  }
  users.forEach(u => { delete u.pass; delete u.pin; });
  if (admin.aprueba) admin.tienePin = false;
  p('Empresas, equipos y usuarios…');
  for (const co of kv.companies) { migrarDiseno(co); migrarTipos(co); }
  const counters = kv.companies.map(co => ['set', 'counters/' + co.id, { next: (co.seq || 0) + 1 }]);
  kv.companies.forEach(co => delete co.seq);
  await paso('Empresas, equipos y usuarios', () => commitOps([...kv.companies.map(o => ['set', 'companies/' + o.id, limpio(o)]), ...(kv.equipos || []).map(o => ['set', 'equipos/' + o.id, limpio(o)]),
    ...users.map(o => ['set', 'users/' + o.id, limpio(o)]), ['set', 'config/settings', limpio({ ...(kv.settings || {}), requireCreds: true, nube: true })], ...counters]));
  const reps = src.reports || [];
  if (reps.length) { p(`Informes (${reps.length})…`); await paso('Informes', () => commitOps(reps.map(r => ['set', 'reports/' + r.id, limpio(r)]))); }
  const fotos = src.photos || [];
  for (let i = 0; i < fotos.length; i++) { if (i % 5 === 0) p(`Fotos ${i + 1}/${fotos.length}…`); await paso('Foto ' + (i + 1), () => FB.setDoc(dref('photos/' + fotos[i].id), limpio(fotos[i]))); }
}

/* ================= ARRANQUE ================= */
async function boot() {
  pantalla('Conectando con la nube…');
  try { await nubeIniciar(); }
  catch (e) { console.error(e); pantalla('No se pudo cargar SGIMTTO. Revise su conexión a internet y vuelva a cargar la página.'); return; }
  FB.onAuthStateChanged(AUTH, u => { alCambiarSesion(u).catch(e => { console.error(e); toast(errTxt(e), 'bad'); }); });
}
boot();
