<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SGIMTTO v9</title>
<style>
:root{
  --bg:#13151a;--bg2:#1e2130;--bg3:#262a3a;--fg:#e8eaf0;--fg2:#9aa0b8;
  --acc:#c0392b;--acc2:#e74c3c;--acc3:#ff6b5b;
  --border:#303450;--shadow:0 4px 20px rgba(0,0,0,.45);
  --rad:10px;--rad2:6px;
  --green:#27ae60;--yellow:#f39c12;--blue:#2980b9;
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

#loginWrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0d0f14,#1a1f2e,#0d0f14)}
.login-logo{font-size:2rem;font-weight:900;color:var(--acc2);text-align:center;margin-bottom:2px}
.login-sub{color:var(--fg2);font-size:.8rem;text-align:center;margin-bottom:28px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.login-card h2{font-size:1rem;margin-bottom:18px;text-align:center;color:var(--fg2);font-weight:600}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:.75rem;color:var(--fg2);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.lf input{width:100%;padding:11px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad2);color:var(--fg);outline:none;transition:.2s}
.lf input:focus{border-color:var(--acc2)}
.btn-login{width:100%;padding:13px;background:var(--acc);color:#fff;border:none;border-radius:var(--rad2);font-weight:700;font-size:.95rem;margin-top:6px}
#loginErr{color:var(--acc2);font-size:.82rem;text-align:center;margin-top:8px;min-height:20px}
.login-footer{color:var(--fg2);font-size:.72rem;text-align:center;margin-top:24px}

#appWrap{display:flex;flex-direction:column;min-height:100vh}
#topBar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg2);border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:100;flex-wrap:wrap}
#topBrand{flex:1;min-width:0}
#topBrand .name{font-weight:900;font-size:.95rem;color:var(--acc2);white-space:nowrap}
#topBrand .sub{font-size:.65rem;color:var(--fg2)}
#topUser{font-size:.72rem;color:var(--fg2);white-space:nowrap}
.nav-btn{padding:6px 12px;border:1px solid var(--border);border-radius:var(--rad2);background:var(--bg3);color:var(--fg);font-size:.76rem;font-weight:600;white-space:nowrap;transition:.15s}
.nav-btn:hover,.nav-btn.active{background:var(--acc);border-color:var(--acc);color:#fff}
#btnSalir{background:transparent;border-color:var(--acc);color:var(--acc)}
#btnSalir:hover{background:var(--acc);color:#fff}
#mainContent{flex:1;padding:14px;max-width:960px;width:100%;margin:0 auto}

.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rad);margin-bottom:14px;overflow:hidden}
.panel-head{background:var(--acc);color:#fff;padding:11px 15px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:.9rem}
.panel-body{padding:14px}

.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.emp-card{background:var(--bg3);border:2px solid var(--border);border-radius:var(--rad);padding:22px 14px;text-align:center;cursor:pointer;transition:.18s}
.emp-card:hover{border-color:var(--acc2);transform:translateY(-2px);box-shadow:var(--shadow)}
.emp-card .eco{font-size:1.5rem;font-weight:900;color:var(--acc2);letter-spacing:.04em}
.emp-card .ename{font-size:.8rem;color:var(--fg2);margin-top:5px}
.emp-card .ecount{font-size:.68rem;color:var(--fg2);margin-top:2px}

.gen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:500px){.gen-grid{grid-template-columns:repeat(2,1fr)}}
.gen-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad);padding:13px 8px;text-align:center;cursor:pointer;transition:.18s}
.gen-card:hover{border-color:var(--acc2);transform:translateY(-1px)}
.gen-card .gid{font-weight:800;font-size:1rem;color:var(--acc2)}
.gen-card .gname{font-size:.66rem;color:var(--fg2);margin-top:2px}
.gen-card .gbahia{font-size:.63rem;color:var(--fg2)}
.gen-card.has-draft{border-color:var(--yellow)}
.gen-card.has-draft .gid{color:var(--yellow)}

.draft-banner{background:var(--bg3);border:2px solid var(--yellow);border-radius:var(--rad);padding:12px 15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.draft-banner:hover{border-color:var(--acc2)}
.draft-banner .db-icon{font-size:1.3rem}
.draft-banner .db-text{flex:1;min-width:0}
.draft-banner .db-title{font-weight:700;font-size:.85rem;color:var(--yellow)}
.draft-banner .db-sub{font-size:.72rem;color:var(--fg2);margin-top:2px}
.draft-banner .db-cont{background:var(--yellow);color:#000;border:none;border-radius:var(--rad2);padding:6px 12px;font-weight:700;font-size:.75rem;white-space:nowrap}

.form-header{background:var(--acc);color:#fff;padding:11px 15px;border-radius:var(--rad) var(--rad) 0 0;display:flex;align-items:center;gap:10px}
.form-header h3{font-size:.9rem;font-weight:700;flex:1}
.btn-back{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:var(--rad2);font-weight:600;font-size:.78rem}
.tab-bar{display:flex;overflow-x:auto;background:var(--bg3);border-bottom:1px solid var(--border);scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;white-space:nowrap;font-size:.74rem;font-weight:600;color:var(--fg2);border-bottom:3px solid transparent;cursor:pointer;transition:.13s;flex-shrink:0}
.tab.active{color:var(--acc2);border-bottom-color:var(--acc2)}
.tab-pane{display:none;padding:15px}
.tab-pane.active{display:block}
.field{margin-bottom:13px}
.field label{display:block;font-size:.72rem;color:var(--fg2);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad2);color:var(--fg);outline:none;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc2)}
.field input:disabled,.field select:disabled{opacity:.6;cursor:not-allowed}
.field textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:480px){.row2,.row3{grid-template-columns:1fr}}

.btn{padding:9px 17px;border:none;border-radius:var(--rad2);font-weight:600;font-size:.82rem;transition:.18s;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.btn-primary{background:var(--acc);color:#fff}
.btn-primary:hover{background:var(--acc2)}
.btn-secondary{background:var(--bg3);color:var(--fg);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--acc2);color:var(--acc2)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{filter:brightness(1.1)}
.btn-warn{background:var(--yellow);color:#000}
.btn-danger{background:#7f0000;color:#fff}

.sec-sep{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--acc2);padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:12px}
.nav-row{display:flex;gap:9px;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}

.st3-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.st3-row:last-child{border-bottom:none}
.st3-label{flex:1;font-size:.8rem;line-height:1.35}
.st3-btns{display:flex;gap:5px;flex-shrink:0}
.st3-btn{width:36px;height:30px;border:1px solid var(--border);border-radius:4px;background:var(--bg3);color:var(--fg2);font-weight:700;font-size:.78rem;transition:.12s}
.st3-btn.sel-ok{background:#1a4a2a;border-color:var(--green);color:var(--green)}
.st3-btn.sel-no{background:#4a1a1a;border-color:var(--acc2);color:var(--acc2)}
.st3-btn.sel-na{background:#2a2a1a;border-color:var(--yellow);color:var(--yellow)}

.sig-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad2);overflow:hidden;position:relative}
.sig-wrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.sig-actions{display:flex;gap:8px;padding:8px;background:var(--bg2)}
.sig-actions button{flex:1;padding:7px;font-size:.75rem;font-weight:600}

.foto-item{position:relative;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad2);overflow:hidden;margin-bottom:10px}
.foto-item img{width:100%;max-height:220px;object-fit:cover;display:block}
.foto-item input{width:100%;padding:7px 10px;background:var(--bg);border:none;border-top:1px solid var(--border);color:var(--fg);font-size:.78rem;outline:none}
.foto-del{position:absolute;top:5px;right:5px;background:rgba(192,57,43,.85);color:#fff;border:none;border-radius:4px;padding:3px 7px;font-size:.78rem;font-weight:700;cursor:pointer}
.foto-add-row{display:flex;gap:10px;margin-top:10px}
.foto-add-btn{flex:1;padding:22px 10px;background:var(--bg3);border:2px dashed var(--border);border-radius:var(--rad);text-align:center;cursor:pointer;color:var(--fg2);font-size:.8rem;transition:.15s}
.foto-add-btn:hover{border-color:var(--acc2);color:var(--acc2)}
.foto-add-btn .ficon{font-size:2rem;display:block;margin-bottom:4px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg2);border-radius:14px 14px 0 0;width:100%;max-width:500px;max-height:90vh;display:flex;flex-direction:column}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;font-weight:700;font-size:.95rem}
.modal-head span{flex:1}
.modal-close{background:none;border:none;color:var(--fg2);font-size:1.4rem;line-height:1;cursor:pointer}
.modal-body{overflow-y:auto;padding:18px;flex:1}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

.pin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.pin-dots{display:flex;gap:10px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--bg3)}
.pin-dot.filled{background:var(--acc2);border-color:var(--acc2)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:220px}
.pin-key{padding:16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad);font-size:1.2rem;font-weight:700;text-align:center}
.pin-key:hover{border-color:var(--acc2)}

.adm-section{margin-bottom:18px}
.adm-section h4{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.adm-list{display:flex;flex-direction:column;gap:8px}
.adm-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad2);padding:10px 12px;display:flex;align-items:center;gap:10px}
.adm-item .ai-info{flex:1;min-width:0}
.adm-item .ai-name{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-item .ai-sub{font-size:.7rem;color:var(--fg2);margin-top:2px}
.adm-item .ai-actions{display:flex;gap:6px;flex-shrink:0}
.adm-item .ai-btn{padding:5px 9px;border:1px solid var(--border);background:var(--bg2);color:var(--fg2);border-radius:4px;font-size:.72rem;cursor:pointer}
.adm-item .ai-btn:hover{border-color:var(--acc2);color:var(--acc2)}

.info-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:700;text-transform:uppercase}
.badge-std{background:#1a3a4a;color:#5bc0de}
.badge-capa{background:#3a2a1a;color:var(--yellow)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);border-radius:var(--rad);padding:12px 20px;font-size:.85rem;font-weight:600;z-index:999;transition:.3s;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}

.visor-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;margin-bottom:10px}
.eq-info-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad);padding:12px;margin-bottom:12px}
.eq-info-card .eic-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.eq-info-card .eic-item{background:var(--bg2);border-radius:4px;padding:4px 9px;font-size:.72rem}
.eq-info-card .eic-label{color:var(--fg2);font-size:.65rem;display:block}
.eq-info-card .eic-val{font-weight:700;color:var(--fg);font-size:.78rem}

.cond-table{width:100%;border-collapse:collapse}
.cond-table th,.cond-table td{padding:8px 10px;border:1px solid var(--border);font-size:.78rem}
.cond-table th{background:var(--bg3);color:var(--fg2);font-size:.7rem;text-transform:uppercase}
.cond-table input{width:100%;background:transparent;border:none;color:var(--fg);outline:none;text-align:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-logo">⚡ SGIMTTO</div>
  <div class="login-sub">Sistema de Gestión de Informes de Mantenimiento</div>
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <div class="lf"><label>Usuario</label><input id="lUser" type="text" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="lf"><label>Contraseña</label><input id="lPass" type="password"></div>
    <button class="btn-login" onclick="doLogin()">Ingresar</button>
    <div id="loginErr"></div>
  </div>
  <div class="login-footer">v9 · 2025 SGIMTTO</div>
</div>

<!-- APP -->
<div id="appWrap" hidden>
  <div id="topBar">
    <div id="topBrand"><div class="name">⚡ SGIMTTO</div><div class="sub" id="topSub">Sistema de Informes</div></div>
    <div id="topUser"></div>
    <button class="nav-btn" id="btnInicio" onclick="goInicio()">🏠 Inicio</button>
    <button class="nav-btn" id="btnAdmin" onclick="goAdmin()" hidden>⚙ Admin</button>
    <button class="nav-btn" id="btnSalir" onclick="doLogout()">Salir</button>
  </div>
  <div id="mainContent"></div>
</div>

<!-- MODALES -->
<div class="overlay" id="mPin" hidden><div class="modal" style="border-radius:14px;max-width:320px;margin:auto">
  <div class="modal-head"><span>🔐 PIN Supervisor</span><button class="modal-close" onclick="closeM('mPin')">✕</button></div>
  <div class="modal-body"><div class="pin-wrap">
    <div id="pinDots" class="pin-dots"></div>
    <div class="pin-grid" id="pinGrid"></div>
    <div id="pinErr" style="color:var(--acc2);font-size:.8rem;min-height:18px"></div>
  </div></div>
</div></div>

<div class="overlay" id="mEmp" hidden><div class="modal">
  <div class="modal-head"><span id="mEmpTitle">Nueva Empresa</span><button class="modal-close" onclick="closeM('mEmp')">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>Código (3-5 letras)</label><input id="xEmpCod" type="text" maxlength="5" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="field"><label>Nombre</label><input id="xEmpNom" type="text"></div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeM('mEmp')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveEmp()">Guardar</button>
  </div>
</div></div>

<div class="overlay" id="mTec" hidden><div class="modal">
  <div class="modal-head"><span id="mTecTitle">Técnico</span><button class="modal-close" onclick="closeM('mTec')">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>Usuario</label><input id="xTecUser" type="text" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="field"><label>Nombre</label><input id="xTecNom" type="text"></div>
    <div class="field"><label>Cargo</label><input id="xTecCargo" type="text" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="field"><label>Contraseña</label><input id="xTecPass" type="text"></div>
    <div class="field"><label>PIN Supervisor (dejar vacío si no aplica)</label><input id="xTecPin" type="text" maxlength="6"></div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeM('mTec')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveTec()">Guardar</button>
  </div>
</div></div>

<div class="overlay" id="mGe" hidden><div class="modal">
  <div class="modal-head"><span id="mGeTitle">Equipo</span><button class="modal-close" onclick="closeM('mGe')">✕</button></div>
  <div class="modal-body">
    <div class="row2">
      <div class="field"><label>Código</label><input id="xGeCod" type="text" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="field"><label>Bahía / Ubicación</label><input id="xGeBahia" type="text"></div>
    </div>
    <div class="field"><label>Nombre / Descripción</label><input id="xGeNom" type="text"></div>
    <div class="row2">
      <div class="field"><label>Marca</label><input id="xGeMarca" type="text"></div>
      <div class="field"><label>Modelo</label><input id="xGeModelo" type="text"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Motor</label><input id="xGeMotor" type="text"></div>
      <div class="field"><label>Potencia</label><input id="xGePot" type="text"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Tensión</label><input id="xGeTens" type="text"></div>
      <div class="field"><label>Serie</label><input id="xGeSerie" type="text"></div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeM('mGe')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveGe()">Guardar</button>
  </div>
</div></div>

<div class="overlay" id="mTipo" hidden><div class="modal">
  <div class="modal-head"><span id="mTipoTitle">Tipo de Informe</span><button class="modal-close" onclick="closeM('mTipo')">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>Nombre</label><input id="xTipoNom" type="text"></div>
    <div class="field"><label>Plantilla</label>
      <select id="xTipoTemplate">
        <option value="estandar">Informe Técnico Estándar</option>
        <option value="capa">Informe de Capa (Quifatex)</option>
      </select>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeM('mTipo')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveTipo()">Guardar</button>
  </div>
</div></div>

<div class="overlay" id="mVisor" hidden><div class="modal" style="border-radius:14px;max-height:95vh;max-width:700px;margin:auto">
  <div class="modal-head"><span>Vista Previa del Informe</span><button class="modal-close" onclick="closeM('mVisor')">✕</button></div>
  <div class="modal-body" style="padding:10px">
    <div class="visor-bar">
      <button class="btn btn-success" onclick="printInforme()">🖨 Imprimir / PDF</button>
      <button class="btn btn-secondary" onclick="closeM('mVisor')">Cerrar</button>
    </div>
    <iframe id="visorFrame" style="width:100%;height:70vh;border:none;border-radius:6px;background:#fff"></iframe>
  </div>
</div></div>

<div id="toastEl" class="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// DB
// ═══════════════════════════════════════════════════════════
const DB_KEY='pim8DB';
let DB={empresas:{},equipos:{},tecnicos:{},tipos:{},historiales:{}};

function loadDB(){
  try{const r=localStorage.getItem(DB_KEY);if(r)DB=JSON.parse(r);}catch(e){}
}
function saveDB(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}
}
function ensureFields(){
  if(!DB.empresas)DB.empresas={};
  if(!DB.equipos)DB.equipos={};
  if(!DB.tecnicos)DB.tecnicos={};
  if(!DB.tipos)DB.tipos={};
  if(!DB.historiales)DB.historiales={};
}

function seed(){
  // Empresas
  DB.empresas['ENL']={id:'ENL',codigo:'ENL',nombre:'ENLICOM S.A.'};
  DB.empresas['QFX']={id:'QFX',codigo:'QFX',nombre:'QUIFATEX'};

  // Tipos ENLICOM
  DB.tipos['t_enl_std']={id:'t_enl_std',nombre:'Informe Técnico Estándar',empresa:'ENL',template:'estandar'};
  DB.tipos['t_enl_250']={id:'t_enl_250',nombre:'Mantenimiento 250 Horas',empresa:'ENL',template:'estandar'};

  // Tipos QUIFATEX

let SES={user:null,empActiva:null,isAdmin:false};

// ═══════════════════════════════════════════════════════════
const DKEY=(eqId,tipoId)=>'pim8_'+eqId+'__'+tipoId;

function parseDraftKey(k){
  if(!k.startsWith('pim8_'))return null;
  const rest=k.slice(5); // remove 'pim8_'
  const sep=rest.indexOf('__');
  if(sep<0)return null;
  const eqId=rest.slice(0,sep);
  const tipoId=rest.slice(sep+2);
  return{eqId,tipoId};
}

function getDrafts(){
  const drafts=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||!k.startsWith('pim8_'))continue;
      const p=parseDraftKey(k);
      if(!p)continue;
      const eq=DB.equipos[p.eqId];
      const tipo=DB.tipos[p.tipoId];
      if(eq&&tipo&&eq.empresa===SES.empActiva){
        try{
          const d=JSON.parse(localStorage.getItem(k));
          drafts.push({k,eqId:p.eqId,tipoId:p.tipoId,eq,tipo,d});
        }catch(e){}
      }
    }
  }catch(e){}
  return drafts;
}

function hoy(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function autoSave(){
  if(!_eqId||!_tipoId)return;
  collectFS();
  try{localStorage.setItem(DKEY(_eqId,_tipoId),JSON.stringify(FS));}catch(e){}
}

  clearTimeout(_asTimer);
  _asTimer=setTimeout(autoSave,2500);
}

// ═══════════════════════════════════════════════════════════
// ABRIR FORM
// ═══════════════════════════════════════════════════════════
function openEquipoConTipo(eq,tipo){
  _eqId=eq.id;_tipoId=tipo.id;_tipoTemplate=tipo.template||'estandar';
  fsReset();
  // Cargar borrador si existe
  try{
    const saved=localStorage.getItem(DKEY(_eqId,_tipoId));
    if(saved){const d=JSON.parse(saved);Object.assign(FS,d);}
  }catch(e){}
  _curTab=0;
  buildForm(eq,tipo);
}

function buildForm(eq,tipo){
  const mc=document.getElementById('mainContent');
  const tmpl=tipo.template||'estandar';
  const tabs=tmpl==='capa'
    ?['1.Identificación','2.Detalle','3.Fotos Antes','4.Fotos Después','5.Notas']
    :['1.Identificación','2.Condiciones','3.ATS','4.Revisión','5.Fotos','6.Firmas'];

  mc.innerHTML=`
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--rad)">
      <div class="form-header">
        <button class="btn-back" onclick="openEquipo('${eq.id}')">← Volver</button>
        <h3>${eq.codigo} · ${tipo.nombre}</h3>
        <button class="btn-back" onclick="confirmClear()" style="background:rgba(255,200,0,.25);margin-left:auto">🗑 Limpiar</button>
      </div>
      <div class="tab-bar" id="tabBar">
        ${tabs.map((t,i)=>`<div class="tab${i===0?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}
      </div>
      <div id="tabContent"></div>
    </div>`;

  renderTab(0,eq,tipo);
}

function goTab(idx){
  collectFS();
  _curTab=idx;
  const eq=DB.equipos[_eqId];
  const tipo=DB.tipos[_tipoId];
  renderTab(idx,eq,tipo);
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  trigAS();
}

function renderTab(idx,eq,tipo){
  const tmpl=tipo.template||'estandar';
  const el=document.getElementById('tabContent');
  if(tmpl==='capa'){
    const fns=[pCapa0,pCapa1,pCapa2,pCapa3,pCapa4];
    el.innerHTML=fns[idx]?fns[idx](eq,tipo):'';
  }else{
    const fns=[p0,p1,p2,p3,p4,p5];
    el.innerHTML=fns[idx]?fns[idx](eq,tipo):'';
  }
  restoreFS(idx,tmpl);
}

function confirmClear(){
  if(!confirm('¿Limpiar el formulario? Se borrarán todos los datos ingresados.'))return;
  try{localStorage.removeItem(DKEY(_eqId,_tipoId));}catch(e){}
  const eq=DB.equipos[_eqId];const tipo=DB.tipos[_tipoId];
  fsReset();buildForm(eq,tipo);showToast('Formulario limpiado.');
}

function renderFotos(arrKey){
  const arr=FS[arrKey]||[];
  const c=document.getElementById('fotoContainer'+(arrKey!=='fotoData'?arrKey.replace('foto',''):''));
  if(!c)return;
  if(arr.length===0){c.innerHTML='<div style="color:var(--fg2);font-size:.8rem;padding:10px 0">Sin fotos aún</div>';return;}
  c.innerHTML=arr.map((f,i)=>`
    <div class="foto-item">
      <img src="${f.b64}" alt="foto ${i+1}">
      <button class="foto-del" onclick="delFoto('${arrKey}',${i})">✕</button>
      <input placeholder="Descripción de la foto..." value="${f.cap||''}" oninput="FS['${arrKey}'][${i}].cap=this.value;trigAS()">
    </div>`).join('');
}

function addFoto(arrKey,modo){
  const inputId=modo==='camara'?'fotoFileInput':'fotoGalInput';
  _fotoTarget=arrKey;
  document.getElementById(inputId).click();
}

function onFotoFile(input,arrKey){
  const files=Array.from(input.files||[]);
  files.forEach(file=>{
    const fr=new FileReader();
    fr.onload=e=>{
      if(!FS[arrKey])FS[arrKey]=[];
      FS[arrKey].push({b64:e.target.result,cap:''});
      renderFotos(arrKey);
      trigAS();
    };
    fr.readAsDataURL(file);
  });
  input.value='';
}

function delFoto(arrKey,idx){
  if(!FS[arrKey])return;
  FS[arrKey].splice(idx,1);
  renderFotos(arrKey);
  trigAS();
}

function initSig(id){
  const can=document.getElementById('can'+id.charAt(0).toUpperCase()+id.slice(1));
  if(!can)return;
  const ctx=can.getContext('2d');
  ctx.strokeStyle='#e8eaf0';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
  _sigCtx[id]=ctx;
  // Restore
  const img=FS['sig'+id.charAt(0).toUpperCase()+id.slice(1)];
  if(img){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0);i.src=img;}
  // Events
  function pos(e){
    const r=can.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*(can.width/r.width),y:(src.clientY-r.top)*(can.height/r.height)};
  }
  can.addEventListener('mousedown',e=>{_sigDrawing[id]=true;ctx.beginPath();const p=pos(e);ctx.moveTo(p.x,p.y);});
  can.addEventListener('mousemove',e=>{if(!_sigDrawing[id])return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
  can.addEventListener('mouseup',()=>{_sigDrawing[id]=false;});
  can.addEventListener('touchstart',e=>{e.preventDefault();_sigDrawing[id]=true;ctx.beginPath();const p=pos(e);ctx.moveTo(p.x,p.y);},{passive:false});
  can.addEventListener('touchmove',e=>{e.preventDefault();if(!_sigDrawing[id])return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
  can.addEventListener('touchend',()=>{_sigDrawing[id]=false;});
}

function clearSig(id){
  const ctx=_sigCtx[id];
  if(!ctx)return;
  const can=ctx.canvas;
  ctx.clearRect(0,0,can.width,can.height);
  const key='sig'+id.charAt(0).toUpperCase()+id.slice(1);
  FS[key]=null;
  FS[key+'Ok']=false;
  const stat=document.getElementById('sig'+id.charAt(0).toUpperCase()+id.slice(1)+'Status');
  if(stat)stat.textContent='Sin firma';
  trigAS();
}

function saveSig(id){
  const ctx=_sigCtx[id];if(!ctx)return;
  const can=ctx.canvas;
  const key='sig'+id.charAt(0).toUpperCase()+id.slice(1);
  FS[key]=can.toDataURL('image/png');
  FS[key+'Ok']=true;
  const stat=document.getElementById('sig'+id.charAt(0).toUpperCase()+id.slice(1)+'Status');
  if(stat)stat.textContent='✓ Firma guardada';
  showToast('✓ Firma guardada');
  trigAS();
}

// PIN para supervisor
let _pinBuf='',_pinCb=null;
function requestSupPin(){
  // Primero guardar la firma del canvas
  const ctx=_sigCtx['sup'];
  if(ctx){FS.sigSup=ctx.canvas.toDataURL('image/png');}
  // Verificar que haya un supervisor seleccionado
  collectFS();
  const sup=DB.tecnicos[FS.supSelId];
  if(!sup||!sup.pin){showToast('Seleccione un supervisor con PIN primero.');return;}
  openPIN(pin=>{
    if(pin===sup.pin){
      FS.sigSupOk=true;
      const stat=document.getElementById('sigSupStatus');
      if(stat)stat.textContent='✓ Firma confirmada con PIN';
      showToast('✓ PIN correcto. Firma confirmada.');
      trigAS();
    }else{
      showToast('❌ PIN incorrecto');
    }
  });
}

function openPIN(cb){
  _pinBuf='';_pinCb=cb;
  renderPinDots();
  renderPinGrid();
  document.getElementById('pinErr').textContent='';
  openM('mPin');
}

function renderPinDots(){
  const d=document.getElementById('pinDots');
  if(!d)return;
  d.innerHTML=Array(4).fill(0).map((_,i)=>`<div class="pin-dot${i<_pinBuf.length?' filled':''}"></div>`).join('');
}

function renderPinGrid(){
  const g=document.getElementById('pinGrid');
  if(!g)return;
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  g.innerHTML=keys.map(k=>k===''?'<div></div>':`<button class="pin-key" onclick="pinKey('${k}')">${k}</button>`).join('');
}

function pinKey(k){
  if(k==='⌫'){_pinBuf=_pinBuf.slice(0,-1);}
  else{if(_pinBuf.length>=6)return;_pinBuf+=k;}
  renderPinDots();
  if(_pinBuf.length>=4){
    setTimeout(()=>{
      closeM('mPin');
      if(_pinCb)_pinCb(_pinBuf);
      _pinBuf='';_pinCb=null;
    },200);
  }
}

// COLLECT & RESTORE FS
// ═══════════════════════════════════════════════════════════
function collectFS(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  FS.nOT=g('fNOT');FS.fecha=g('fFecha');FS.horaIni=g('fHoraIni');
  FS.horaFin=g('fHoraFin');FS.horometro=g('fHorometro');
  FS.nCapa=g('fNcapa');
  FS.antecedentes=g('fAntec');FS.alcance=g('fAlcance');FS.objetivos=g('fObjetivos');
  FS.desarrollo=g('fDesarrollo');FS.obs=g('fObs');FS.detalle=g('fDetalle');
  FS.concl=g('fConcl');FS.rec=g('fRec');FS.atsObs=g('fAtsObs');
  FS.tecSelId=g('fTecSel');FS.supSelId=g('fSupSel');
  // Cond
  COND_PARAMS.forEach((_,i)=>{
    const vEl=document.getElementById('cv'+i+'_val');
    const uEl=document.getElementById('cv'+i+'_uni');
    if(vEl||uEl){
      const cv=FS.condVals['cv'+i]||{};
      if(vEl)cv.val=vEl.value;
      if(uEl)cv.uni=uEl.value;
      FS.condVals['cv'+i]=cv;
    }
  });
}

function restoreFS(idx,tmpl){
  // Render fotos según tab
  setTimeout(()=>{
    if(tmpl==='capa'){
      if(idx===2){renderFotosAlt('fotoAntes','fotoContainerAntes');}
      if(idx===3){renderFotosAlt('fotoDespues','fotoContainerDespues');}
    }else{
      if(idx===4){renderFotosAlt('fotoData','fotoContainer');}
      if(idx===5){initSig('tec');initSig('sup');}
    }
  },50);
}

function renderFotosAlt(arrKey,containerId){
  const arr=FS[arrKey]||[];
  const c=document.getElementById(containerId);
  if(!c)return;
  if(arr.length===0){c.innerHTML='<div style="color:var(--fg2);font-size:.8rem;padding:10px 0">Sin fotos aún</div>';return;}
  c.innerHTML=arr.map((f,i)=>`
    <div class="foto-item">
      <img src="${f.b64}" alt="foto ${i+1}">
      <button class="foto-del" onclick="delFotoAlt('${arrKey}','${containerId}',${i})">✕</button>
      <input placeholder="Descripción..." value="${f.cap||''}" oninput="FS['${arrKey}'][${i}].cap=this.value;trigAS()">
    </div>`).join('');
}

function delFotoAlt(arrKey,containerId,idx){
  if(!FS[arrKey])return;
  FS[arrKey].splice(idx,1);
  renderFotosAlt(arrKey,containerId);
  trigAS();
}

function addFoto(arrKey,modo){
  if(arrKey==='fotoDespues'){
    const inputId=modo==='camara'?'fotoFileInputD':'fotoGalInputD';
    _fotoTarget=arrKey;
    const el=document.getElementById(inputId);
    if(el){el.click();}
    return;
  }
  const inputId=modo==='camara'?'fotoFileInput':'fotoGalInput';
  _fotoTarget=arrKey;
  const el=document.getElementById(inputId);
  if(el){el.click();}
}

function onFotoFile(input,arrKey){
  const files=Array.from(input.files||[]);
  files.forEach(file=>{
    const fr=new FileReader();
    fr.onload=e=>{
      if(!FS[arrKey])FS[arrKey]=[];
      FS[arrKey].push({b64:e.target.result,cap:''});
      // Re-render
      const containerMap={fotoData:'fotoContainer',fotoAntes:'fotoContainerAntes',fotoDespues:'fotoContainerDespues'};
      const cid=containerMap[arrKey]||'fotoContainer';
      renderFotosAlt(arrKey,cid);
      trigAS();
    };
    fr.readAsDataURL(file);
  });
  input.value='';
}

function generarInforme(){
  collectFS();
  autoSave();
  const eq=DB.equipos[_eqId];
  const tipo=DB.tipos[_tipoId];
  const emp=DB.empresas[SES.empActiva]||{};
  const tmpl=tipo.template||'estandar';
  const tec=DB.tecnicos[FS.tecSelId]||SES.user||{};
  const sup=DB.tecnicos[FS.supSelId]||{};

  let html='';
  if(tmpl==='capa'){
    html=genCapa(eq,tipo,emp,tec,sup);
  }else{
    html=genEstandar(eq,tipo,emp,tec,sup);
  }

  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  document.getElementById('visorFrame').src=url;
  openM('mVisor');
}

function printInforme(){
  const frame=document.getElementById('visorFrame');
  if(frame&&frame.contentWindow){
    frame.contentWindow.print();
  }
}
